<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whack-a-Mole BLE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.85rem;
      color: #fbbf24;
      margin-bottom: 16px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .stats strong {
      color: #4ade80;
    }

    .board-container {
      position: relative;
      margin-bottom: 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .hole {
      background: #333;
      aspect-ratio: 1;
      font-size: 1.8rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.1s, background 0.1s;
    }

    .hole.active {
      background: #854d0e;
      cursor: pointer;
    }

    .hole.active.bomb {
      background: #7f1d1d;
    }

    .hole.active.golden {
      background: #ca8a04;
    }

    .hole.active.clock {
      background: #1e3a8a;
    }

    .hole.hit {
      background: #166534;
      transform: scale(0.95);
    }

    .hole.hit-bomb {
      background: #991b1b;
      transform: scale(0.95);
    }

    /* Flying Time Bonus Effect */
    .flying-bonus {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      pointer-events: none;
      z-index: 20;
      transition: all 0.8s ease-out;
    }

    /* Overlay for 3-Second Countdown */
    #countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      font-weight: bold;
      color: #fbbf24;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    #countdown-overlay.show {
      opacity: 1;
    }

    #message {
      font-weight: bold;
      margin-bottom: 20px;
      min-height: 1.2em;
    }

    .leaderboard-container {
      background: #2a2a2a;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
    }

    .leaderboard-container h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
      color: #fbbf24;
    }

    #leaderboard-list {
      list-style: none;
    }

    #leaderboard-list li {
      padding: 6px 0;
      border-bottom: 1px solid #3d3d3d;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }

    #leaderboard-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🐹 Whack-a-Mole</h1>
    <p>Watch out for combos, bombs, and time clocks!</p>

    <div class="toolbar">
      <button id="connect">Connect Controller</button>
      <button id="start" disabled>Start Game</button>
    </div>

    <p id="status">Controller disconnected</p>

    <div class="stats">
      <div>Score: <strong id="score">0</strong></div>
      <div>Combo: <strong id="combo">0X</strong></div>
      <div>Time: <strong id="time">30</strong>s</div>
    </div>

    <div class="board-container">
      <div id="board" aria-label="Sixteen-hole game board"></div>
      <div id="countdown-overlay">3</div>
    </div>

    <p id="message">Connect your controller to begin.</p>

    <section class="leaderboard-container">
      <h2>🏆 Leaderboard</h2>
      <ul id="leaderboard-list">
        <li><em>No scores yet</em></li>
      </ul>
    </section>
  </main>

  <script>
    const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
    const EVENT_UUID   = "12345678-1234-5678-1234-56789abcdef1";

    const board = document.querySelector("#board");
    const connectBtn = document.querySelector("#connect");
    const startBtn = document.querySelector("#start");
    const statusEl = document.querySelector("#status");
    const messageEl = document.querySelector("#message");
    const scoreEl = document.querySelector("#score");
    const comboEl = document.querySelector("#combo");
    const timeEl = document.querySelector("#time");
    const leaderboardList = document.querySelector("#leaderboard-list");
    const countdownOverlay = document.querySelector("#countdown-overlay");
    const boardContainer = document.querySelector(".board-container");

    let device = null;
    let characteristic = null;
    let connected = false;
    let playing = false;
    let score = 0;
    let combo = 0;
    let timeLeft = 30;
    let gameTimer = null;
    let spawnInterval = null;
    let leaderboard = [];
    let currentUser = "NO NAME";

    // Tracking spawned targets per hole: { type: 'normal'|'golden'|'bomb'|'clock', timer: timeoutId }
    let holesState = Array(16).fill(null).map(() => ({ type: null, timer: null }));
    let clocksSpawnedThisGame = 0;
    let targetClockCount = 5;

    // Web Audio Context initialization
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // --- High Volume Amplified Sound FX ---
    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);

      gain.gain.setValueAtTime(0.7, audioCtx.currentTime); // Louder
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playGoldenSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);

      gain.gain.setValueAtTime(0.8, now); // Louder
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(now + 0.35);
    }

    function playClockSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1174.66, now + 0.1);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(now + 0.25);
    }

    function playBombSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.8;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.linearRampToValueAtTime(80, now + 0.7);

      // VERY LOUD explosion gain boost (gain: 3.5)
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(3.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
      noise.stop(now + 0.75);
    }

    function playBeepSound(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Build grid of 16 holes
    const holes = Array.from({ length: 16 }, (_, id) => {
      const button = document.createElement("button");
      button.className = "hole";
      button.textContent = "🕳️";
      button.setAttribute("aria-label", `Hole ${id + 1}`);
      button.addEventListener("click", () => hitHole(id));
      board.appendChild(button);
      return button;
    });

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function clearAllHoles() {
      holesState.forEach((state, id) => {
        if (state.timer) clearTimeout(state.timer);
        holes[id].className = "hole";
        holes[id].textContent = "🕳️";
      });
      holesState = Array(16).fill(null).map(() => ({ type: null, timer: null }));
    }

    function spawnMultipleTargets() {
      if (!playing) return;

      // Find available empty holes
      let emptyIndices = holesState
        .map((st, idx) => st.type === null ? idx : -1)
        .filter(idx => idx !== -1);

      if (emptyIndices.length === 0) return;

      // Pick 1 to 3 random empty holes to spawn targets simultaneously
      let spawnCount = Math.min(emptyIndices.length, Math.floor(Math.random() * 3) + 1);
      
      for (let i = 0; i < spawnCount; i++) {
        if (emptyIndices.length === 0) break;
        let randomIndexPos = Math.floor(Math.random() * emptyIndices.length);
        let id = emptyIndices.splice(randomIndexPos, 1)[0];

        // Determine type: Normal (50%), Golden (20%), Bomb (20%), Clock (10% if limit not reached)
        let rand = Math.random();
        let type = 'normal';
        let duration = 900;

        if (clocksSpawnedThisGame < targetClockCount && rand < 0.12) {
          type = 'clock';
          duration = 800;
          clocksSpawnedThisGame++;
        } else if (rand < 0.32) {
          type = 'golden';
          duration = 600;
        } else if (rand < 0.52) {
          type = 'bomb';
          duration = 750;
        } else {
          type = 'normal';
          duration = 900;
        }

        holes[id].className = `hole active ${type}`;
        if (type === 'normal') holes[id].textContent = "🐹";
        if (type === 'golden') holes[id].textContent = "🌟";
        if (type === 'bomb') holes[id].textContent = "💣";
        if (type === 'clock') holes[id].textContent = "⏳";

        holesState[id].type = type;
        holesState[id].timer = setTimeout(() => {
          if (playing) {
            holes[id].className = "hole";
            holes[id].textContent = "🕳️";
            holesState[id] = { type: null, timer: null };
          }
        }, duration);
      }
    }

    function hitHole(id) {
      if (!playing || holesState[id].type === null) return;

      let type = holesState[id].type;
      clearTimeout(holesState[id].timer);
      holesState[id] = { type: null, timer: null };

      if (type === 'bomb') {
        playBombSound();
        holes[id].className = "hole hit-bomb";
        holes[id].textContent = "💥";
        score = Math.max(0, score - 1);
        combo = 0; // Reset combo on bomb
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "Ouch! Hit a bomb! (-1 pt, Combo Lost)";
      } else if (type === 'golden') {
        playGoldenSound();
        holes[id].className = "hole hit";
        holes[id].textContent = "✨";
        combo++;
        score += 2;
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "Golden hit! (+2 pts)";
      } else if (type === 'clock') {
        playClockSound();
        holes[id].className = "hole hit";
        holes[id].textContent = "⏱️";
        timeLeft += 5;
        timeEl.textContent = timeLeft;
        messageEl.textContent = "Time Bonus! (+5 seconds)";
        triggerFlyingBonus(holes[id]);
      } else {
        playHitSound();
        holes[id].className = "hole hit";
        holes[id].textContent = "💥";
        combo++;
        score += 1;
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "Nice hit!";
      }

      setTimeout(() => {
        holes[id].className = "hole";
        holes[id].textContent = "🕳️";
      }, 180);
    }

    function triggerFlyingBonus(holeElement) {
      const bonusEl = document.createElement("div");
      bonusEl.className = "flying-bonus";
      bonusEl.textContent = "+5s ⏳";

      const holeRect = holeElement.getBoundingClientRect();
      const boardRect = boardContainer.getBoundingClientRect();

      bonusEl.style.left = (holeRect.left - boardRect.left + holeRect.width / 2 - 20) + "px";
      bonusEl.style.top = (holeRect.top - boardRect.top) + "px";

      boardContainer.appendChild(bonusEl);

      setTimeout(() => {
        bonusEl.style.transform = "translateY(-80px) scale(1.3)";
        bonusEl.style.opacity = "0";
      }, 50);

      setTimeout(() => {
        bonusEl.remove();
      }, 850);
    }

    function startGame() {
      initAudio();

      let username = prompt("Enter your username:", "NO NAME");
      if (!username || username.trim() === "") {
        currentUser = "NO NAME";
      } else {
        currentUser = username.trim();
      }

      clearInterval(gameTimer);
      clearInterval(spawnInterval);
      clearAllHoles();

      score = 0;
      combo = 0;
      timeLeft = 30;
      clocksSpawnedThisGame = 0;
      targetClockCount = Math.floor(Math.random() * 3) + 5; // 5 to 7 clocks per game
      playing = false;

      scoreEl.textContent = score;
      comboEl.textContent = combo + "X";
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      runCountdown(3, () => {
        playing = true;
        messageEl.textContent = `Go ${currentUser}! Catch the moles!`;
        
        // Spawn multiple targets continuously every 600ms
        spawnInterval = setInterval(() => {
          spawnMultipleTargets();
        }, 600);

        gameTimer = setInterval(() => {
          timeLeft--;
          timeEl.textContent = timeLeft;

          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      });
    }

    function runCountdown(seconds, callback) {
      let count = seconds;
      countdownOverlay.textContent = count;
      countdownOverlay.classList.add("show");
      messageEl.textContent = `Get ready, ${currentUser}...`;
      playBeepSound(440);

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownOverlay.textContent = count;
          playBeepSound(440);
        } else if (count === 0) {
          countdownOverlay.textContent = "GO!";
          playBeepSound(880);
        } else {
          clearInterval(countdownInterval);
          countdownOverlay.classList.remove("show");
          callback();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(gameTimer);
      clearInterval(spawnInterval);
      clearAllHoles();

      startBtn.disabled = !connected;
      messageEl.textContent = `Game over, ${currentUser}! Final score: ${score}`;

      updateLeaderboard(currentUser, score);
    }

    function updateLeaderboard(name, finalScore) {
      leaderboard.push({ name, score: finalScore });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 5);

      leaderboardList.innerHTML = "";
      leaderboard.forEach((entry, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${entry.name}</span><strong>${entry.score} pts</strong>`;
        leaderboardList.appendChild(li);
      });
    }

    async function connectController() {
      initAudio();

      if (!navigator.bluetooth) {
        setStatus("Web Bluetooth unavailable. Use Chrome/Edge over HTTPS or Localhost.");
        return;
      }

      try {
        setStatus("Choose MoleController in the Bluetooth picker...");

        device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener("gattserverdisconnected", () => {
          connected = false;
          playing = false;
          clearInterval(gameTimer);
          clearInterval(spawnInterval);
          clearAllHoles();

          startBtn.disabled = true;
          setStatus("Controller disconnected");
          messageEl.textContent = "Reconnect your controller to play.";
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(EVENT_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", onButtonEvent);

        connected = true;
        startBtn.disabled = false;
        setStatus(`Connected: ${device.name || "MoleController"}`);
        messageEl.textContent = "Ready! Start the game.";
      } catch (error) {
        setStatus(`Connection failed: ${error.message}`);
      }
    }

    function onButtonEvent(event) {
      const data = event.target.value;
      const id = data.getUint8(0);
      const pressed = data.getUint8(1) === 1;

      if (pressed && id < 16) {
        hitHole(id);
      }
    }

    connectBtn.addEventListener("click", connectController);
    startBtn.addEventListener("click", startGame);

    // Keyboard controls for testing (Keys 1-9, A-G)
    document.addEventListener("keydown", event => {
      if (event.repeat) return;
      const key = event.key.toUpperCase();
      const id = "123456789ABCDEFG".indexOf(key);
      if (id >= 0) hitHole(id);
    });
  </script>
</body>
</html>
