<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whack-a-Mole BLE - Extreme Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .game {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.85rem;
      color: #fbbf24;
      margin-bottom: 12px;
    }

    #active-buff {
      font-size: 0.9rem;
      font-weight: bold;
      color: #38bdf8;
      min-height: 1.2em;
      margin-bottom: 12px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .stats strong {
      color: #4ade80;
    }

    .board-container {
      position: relative;
      margin-bottom: 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .hole {
      background: #333;
      aspect-ratio: 1;
      font-size: 1.8rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.1s, background 0.1s;
    }

    .hole.active { background: #854d0e; cursor: pointer; }
    .hole.active.bomb { background: #7f1d1d; }
    .hole.active.golden { background: #ca8a04; }
    .hole.active.clock { background: #1e3a8a; }
    .hole.active.buff { background: #047857; }
    .hole.active.scare { background: #581c87; }

    .hole.hit { background: #166534; transform: scale(0.95); }
    .hole.hit-bomb { background: #991b1b; transform: scale(0.95); }

    /* Floating Particles & Effects */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.2rem;
      z-index: 25;
      animation: popFly 0.8s ease-out forwards;
    }

    @keyframes popFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }

    .flying-bonus {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      pointer-events: none;
      z-index: 20;
      transition: all 0.8s ease-out;
    }

    /* Overlay for 3-Second Countdown */
    #countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      font-weight: bold;
      color: #fbbf24;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    #countdown-overlay.show { opacity: 1; }

    /* Full-Screen Jumpscare Overlay */
    #jumpscare-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
    }

    #jumpscare-overlay.active {
      opacity: 1;
      animation: flashScare 0.1s infinite alternate;
    }

    #jumpscare-face {
      font-size: 18rem;
      transform: scale(1);
      animation: shakeFace 0.05s infinite alternate;
    }

    @keyframes flashScare {
      0% { background: #000; }
      100% { background: #991b1b; }
    }

    @keyframes shakeFace {
      0% { transform: scale(1.2) rotate(-5deg); }
      100% { transform: scale(1.5) rotate(5deg); }
    }

    #message {
      font-weight: bold;
      margin-bottom: 20px;
      min-height: 1.2em;
    }

    .leaderboard-container {
      background: #2a2a2a;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
    }

    .leaderboard-container h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
      color: #fbbf24;
    }

    #leaderboard-list { list-style: none; }
    #leaderboard-list li {
      padding: 6px 0;
      border-bottom: 1px solid #3d3d3d;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }
    #leaderboard-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🐹 Whack-a-Mole EXTREME</h1>
    <p>Buffs, Debuffs, Power-ups & Scary Surprises!</p>

    <div class="toolbar">
      <button id="connect">Connect Controller</button>
      <button id="start" disabled>Start Game</button>
    </div>

    <p id="status">Controller disconnected</p>
    <div id="active-buff"></div>

    <div class="stats">
      <div>Score: <strong id="score">0</strong></div>
      <div>Combo: <strong id="combo">0X</strong></div>
      <div>Time: <strong id="time">30</strong>s</div>
    </div>

    <div class="board-container">
      <div id="board" aria-label="Sixteen-hole game board"></div>
      <div id="countdown-overlay">3</div>
    </div>

    <p id="message">Connect your controller to begin.</p>

    <section class="leaderboard-container">
      <h2>🏆 Leaderboard</h2>
      <ul id="leaderboard-list">
        <li><em>No scores yet</em></li>
      </ul>
    </section>
  </main>

  <div id="jumpscare-overlay">
    <div id="jumpscare-face">👹</div>
  </div>

  <script>
    const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
    const EVENT_UUID   = "12345678-1234-5678-1234-56789abcdef1";

    const board = document.querySelector("#board");
    const connectBtn = document.querySelector("#connect");
    const startBtn = document.querySelector("#start");
    const statusEl = document.querySelector("#status");
    const activeBuffEl = document.querySelector("#active-buff");
    const messageEl = document.querySelector("#message");
    const scoreEl = document.querySelector("#score");
    const comboEl = document.querySelector("#combo");
    const timeEl = document.querySelector("#time");
    const leaderboardList = document.querySelector("#leaderboard-list");
    const countdownOverlay = document.querySelector("#countdown-overlay");
    const jumpscareOverlay = document.querySelector("#jumpscare-overlay");
    const jumpscareFace = document.querySelector("#jumpscare-face");
    const boardContainer = document.querySelector(".board-container");

    let device = null;
    let characteristic = null;
    let connected = false;
    let playing = false;
    let score = 0;
    let combo = 0;
    let timeLeft = 30;
    let gameTimer = null;
    let spawnInterval = null;
    let leaderboard = [];
    let currentUser = "NO NAME";

    // Buffs / Debuffs State
    let scoreMultiplier = 1;
    let frozen = false;
    let invertedControls = false;
    let buffTimer = null;

    let holesState = Array(16).fill(null).map(() => ({ type: null, timer: null }));
    let clocksSpawnedThisGame = 0;
    let targetClockCount = 5;

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playGoldenSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.35);
    }

    function playBuffSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.3);
    }

    function playClockSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1174.66, now + 0.1);
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.25);
    }

    function playBombSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.8;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.linearRampToValueAtTime(80, now + 0.7);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(3.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
      noise.stop(now + 0.75);
    }

    function playScreamSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1500, now);
      osc.frequency.linearRampToValueAtTime(400, now + 0.5);
      gain.gain.setValueAtTime(4.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.6);
    }

    function playBeepSound(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Build grid of 16 holes
    const holes = Array.from({ length: 16 }, (_, id) => {
      const button = document.createElement("button");
      button.className = "hole";
      button.textContent = "🕳️";
      button.setAttribute("aria-label", `Hole ${id + 1}`);
      button.addEventListener("click", () => processHit(id));
      board.appendChild(button);
      return button;
    });

    function setStatus(text) { statusEl.textContent = text; }

    function clearAllHoles() {
      holesState.forEach((state, id) => {
        if (state.timer) clearTimeout(state.timer);
        holes[id].className = "hole";
        holes[id].textContent = "🕳️";
      });
      holesState = Array(16).fill(null).map(() => ({ type: null, timer: null }));
    }

    function triggerJumpscare() {
      const scaryFaces = ["👹", "💀", "👻", "🤡", "👾"];
      jumpscareFace.textContent = scaryFaces[Math.floor(Math.random() * scaryFaces.length)];
      jumpscareOverlay.classList.add("active");
      playScreamSound();

      setTimeout(() => {
        jumpscareOverlay.classList.remove("active");
      }, 700);
    }

    function applyRandomBuffOrDebuff() {
      const effects = ["double", "freeze", "invert"];
      const chosen = effects[Math.floor(Math.random() * effects.length)];
      
      clearTimeout(buffTimer);
      scoreMultiplier = 1;
      frozen = false;
      invertedControls = false;

      if (chosen === "double") {
        scoreMultiplier = 2;
        activeBuffEl.textContent = "⚡ BUFF: 2x Points Active! (8s)";
        activeBuffEl.style.color = "#4ade80";
        buffTimer = setTimeout(() => { resetBuffs(); }, 8000);
      } else if (chosen === "freeze") {
        frozen = true;
        activeBuffEl.textContent = "❄️ DEBUFF: FROZEN! (3s)";
        activeBuffEl.style.color = "#38bdf8";
        buffTimer = setTimeout(() => { resetBuffs(); }, 3000);
      } else if (chosen === "invert") {
        invertedControls = true;
        activeBuffEl.textContent = "🌀 DEBUFF: Inverted Controls! (6s)";
        activeBuffEl.style.color = "#f43f5e";
        buffTimer = setTimeout(() => { resetBuffs(); }, 6000);
      }
    }

    function resetBuffs() {
      scoreMultiplier = 1;
      frozen = false;
      invertedControls = false;
      activeBuffEl.textContent = "";
    }

    function spawnMultipleTargets() {
      if (!playing) return;

      let emptyIndices = holesState
        .map((st, idx) => st.type === null ? idx : -1)
        .filter(idx => idx !== -1);

      if (emptyIndices.length === 0) return;

      let spawnCount = Math.min(emptyIndices.length, Math.floor(Math.random() * 3) + 1);
      
      for (let i = 0; i < spawnCount; i++) {
        if (emptyIndices.length === 0) break;
        let randomIndexPos = Math.floor(Math.random() * emptyIndices.length);
        let id = emptyIndices.splice(randomIndexPos, 1)[0];

        let rand = Math.random();
        let type = 'normal';
        let duration = 900;

        if (clocksSpawnedThisGame < targetClockCount && rand < 0.10) {
          type = 'clock';
          duration = 800;
          clocksSpawnedThisGame++;
        } else if (rand < 0.22) {
          type = 'buff';
          duration = 750;
        } else if (rand < 0.32) {
          type = 'scare';
          duration = 650;
        } else if (rand < 0.47) {
          type = 'golden';
          duration = 600;
        } else if (rand < 0.65) {
          type = 'bomb';
          duration = 750;
        } else {
          type = 'normal';
          duration = 900;
        }

        holes[id].className = `hole active ${type}`;
        if (type === 'normal') holes[id].textContent = "🐹";
        if (type === 'golden') holes[id].textContent = "🌟";
        if (type === 'bomb') holes[id].textContent = "💣";
        if (type === 'clock') holes[id].textContent = "⏳";
        if (type === 'buff') holes[id].textContent = "🎁";
        if (type === 'scare') holes[id].textContent = "👻";

        holesState[id].type = type;
        holesState[id].timer = setTimeout(() => {
          if (playing) {
            holes[id].className = "hole";
            holes[id].textContent = "🕳️";
            holesState[id] = { type: null, timer: null };
          }
        }, duration);
      }
    }

    function processHit(rawId) {
      if (!playing || frozen) return;

      let id = rawId;
      if (invertedControls) {
        id = 15 - rawId; // Reverse mappings across the grid
      }

      if (holesState[id].type === null) return;

      let type = holesState[id].type;
      clearTimeout(holesState[id].timer);
      holesState[id] = { type: null, timer: null };

      if (type === 'scare') {
        triggerJumpscare();
        holes[id].className = "hole hit-bomb";
        holes[id].textContent = "💀";
        combo = 0;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "AAAHHH! Scary surprise!";
      } else if (type === 'bomb') {
        playBombSound();
        if (Math.random() < 0.35) triggerJumpscare(); // 35% chance jumpscare on bomb hit
        holes[id].className = "hole hit-bomb";
        holes[id].textContent = "💥";
        score = Math.max(0, score - 1);
        combo = 0;
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "Ouch! Hit a bomb! (-1 pt)";
      } else if (type === 'golden') {
        playGoldenSound();
        createParticles(holes[id], "✨");
        holes[id].className = "hole hit";
        holes[id].textContent = "🌟";
        combo++;
        score += (2 * scoreMultiplier);
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = `Golden hit! (+${2 * scoreMultiplier} pts)`;
      } else if (type === 'buff') {
        playBuffSound();
        createParticles(holes[id], "⚡");
        holes[id].className = "hole hit";
        holes[id].textContent = "🎁";
        applyRandomBuffOrDebuff();
      } else if (type === 'clock') {
        playClockSound();
        createParticles(holes[id], "⏱️");
        holes[id].className = "hole hit";
        holes[id].textContent = "⏱️";
        timeLeft += 5;
        timeEl.textContent = timeLeft;
        messageEl.textContent = "Time Bonus! (+5 seconds)";
        triggerFlyingBonus(holes[id]);
      } else {
        playHitSound();
        holes[id].className = "hole hit";
        holes[id].textContent = "💥";
        combo++;
        score += (1 * scoreMultiplier);
        scoreEl.textContent = score;
        comboEl.textContent = combo + "X";
        messageEl.textContent = "Nice hit!";
      }

      setTimeout(() => {
        holes[id].className = "hole";
        holes[id].textContent = "🕳️";
      }, 180);
    }

    function createParticles(element, emoji) {
      const rect = element.getBoundingClientRect();
      const boardRect = boardContainer.getBoundingClientRect();

      for (let i = 0; i < 6; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = emoji;

        const dx = (Math.random() - 0.5) * 120 + "px";
        const dy = (Math.random() - 0.5) * 120 + "px";
        p.style.setProperty('--dx', dx);
        p.style.setProperty('--dy', dy);

        p.style.left = (rect.left - boardRect.left + rect.width / 2 - 10) + "px";
        p.style.top = (rect.top - boardRect.top + rect.height / 2 - 10) + "px";

        boardContainer.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function triggerFlyingBonus(holeElement) {
      const bonusEl = document.createElement("div");
      bonusEl.className = "flying-bonus";
      bonusEl.textContent = "+5s ⏳";

      const holeRect = holeElement.getBoundingClientRect();
      const boardRect = boardContainer.getBoundingClientRect();

      bonusEl.style.left = (holeRect.left - boardRect.left + holeRect.width / 2 - 20) + "px";
      bonusEl.style.top = (holeRect.top - boardRect.top) + "px";

      boardContainer.appendChild(bonusEl);

      setTimeout(() => {
        bonusEl.style.transform = "translateY(-80px) scale(1.3)";
        bonusEl.style.opacity = "0";
      }, 50);

      setTimeout(() => bonusEl.remove(), 850);
    }

    function startGame() {
      initAudio();

      let username = prompt("Enter your username:", "NO NAME");
      if (!username || username.trim() === "") {
        currentUser = "NO NAME";
      } else {
        currentUser = username.trim();
      }

      clearInterval(gameTimer);
      clearInterval(spawnInterval);
      resetBuffs();
      clearAllHoles();

      score = 0;
      combo = 0;
      timeLeft = 30;
      clocksSpawnedThisGame = 0;
      targetClockCount = Math.floor(Math.random() * 3) + 5;
      playing = false;

      scoreEl.textContent = score;
      comboEl.textContent = combo + "X";
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      runCountdown(3, () => {
        playing = true;
        messageEl.textContent = `Go ${currentUser}! Catch the moles!`;
        
        spawnInterval = setInterval(() => {
          spawnMultipleTargets();
        }, 550);

        gameTimer = setInterval(() => {
          timeLeft--;
          timeEl.textContent = timeLeft;

          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      });
    }

    function runCountdown(seconds, callback) {
      let count = seconds;
      countdownOverlay.textContent = count;
      countdownOverlay.classList.add("show");
      messageEl.textContent = `Get ready, ${currentUser}...`;
      playBeepSound(440);

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownOverlay.textContent = count;
          playBeepSound(440);
        } else if (count === 0) {
          countdownOverlay.textContent = "GO!";
          playBeepSound(880);
        } else {
          clearInterval(countdownInterval);
          countdownOverlay.classList.remove("show");
          callback();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(gameTimer);
      clearInterval(spawnInterval);
      resetBuffs();
      clearAllHoles();

      startBtn.disabled = !connected;
      messageEl.textContent = `Game over, ${currentUser}! Final score: ${score}`;

      updateLeaderboard(currentUser, score);
    }

    function updateLeaderboard(name, finalScore) {
      leaderboard.push({ name, score: finalScore });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 5);

      leaderboardList.innerHTML = "";
      leaderboard.forEach((entry, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${entry.name}</span><strong>${entry.score} pts</strong>`;
        leaderboardList.appendChild(li);
      });
    }

    async function connectController() {
      initAudio();

      if (!navigator.bluetooth) {
        setStatus("Web Bluetooth unavailable. Use Chrome/Edge over HTTPS or Localhost.");
        return;
      }

      try {
        setStatus("Choose MoleController in the Bluetooth picker...");

        device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener("gattserverdisconnected", () => {
          connected = false;
          playing = false;
          clearInterval(gameTimer);
          clearInterval(spawnInterval);
          resetBuffs();
          clearAllHoles();

          startBtn.disabled = true;
          setStatus("Controller disconnected");
          messageEl.textContent = "Reconnect your controller to play.";
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(EVENT_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", onButtonEvent);

        connected = true;
        startBtn.disabled = false;
        setStatus(`Connected: ${device.name || "MoleController"}`);
        messageEl.textContent = "Ready! Start the game.";
      } catch (error) {
        setStatus(`Connection failed: ${error.message}`);
      }
    }

    function onButtonEvent(event) {
      const data = event.target.value;
      const id = data.getUint8(0);
      const pressed = data.getUint8(1) === 1;

      if (pressed && id < 16) {
        processHit(id);
      }
    }

    connectBtn.addEventListener("click", connectController);
    startBtn.addEventListener("click", startGame);

    // Keyboard controls for testing (Keys 1-9, A-G)
    document.addEventListener("keydown", event => {
      if (event.repeat) return;
      const key = event.key.toUpperCase();
      const id = "123456789ABCDEFG".indexOf(key);
      if (id >= 0) processHit(id);
    });
  </script>
</body>
</html>
